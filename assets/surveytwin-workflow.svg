<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">The surveytwin workflow</title>
  <desc id="desc">Read a standard survey, create a survey in Python, or import QSF into a Survey. Choose personas, a model and settings in RunConfig. Plan and preview without model calls. Run the model and inspect Results.</desc>
  <rect width="1120" height="360" rx="16" fill="#fafcfc"/>
  <style>
    text {font-family: Arial, Helvetica, sans-serif; fill: #24343c}
    .phase {font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #61757d}
    .name {font-size: 23px; font-weight: 700}
    .detail {font-size: 13px; fill: #556c75}
    .fn {font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #167366}
    .input {font-size: 13px; fill: #354b54}
  </style>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#95a9af" stroke-width="1.3"/></marker>
  </defs>
  <text class="phase" x="32" y="33">DEFINE YOUR STUDY</text>
  <text class="phase" x="276" y="33">CHOOSE THE RUN</text>
  <text class="phase" x="474" y="33">PREPARE &amp; PREVIEW</text>
  <text class="phase" x="678" y="33">SIMULATE</text>
  <text class="phase" x="868" y="33">INSPECT &amp; EXPORT</text>
  <rect x="32" y="52" width="218" height="65" rx="8" fill="#eef4f4"/>
  <text class="input" x="46" y="77">Standard JSON · Python code</text>
  <text class="input" x="46" y="99">or an imported QSF</text>
  <rect x="276" y="52" width="174" height="65" rx="8" fill="#eef4f4"/>
  <text class="input" x="290" y="77">Persona bank + model</text>
  <text class="input" x="290" y="99">sample, seed, settings</text>
  <path d="M141 117V145" fill="none" stroke="#95a9af" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M363 117V145" fill="none" stroke="#95a9af" stroke-width="1.3" marker-end="url(#arrow)"/>
  <g fill="#ffffff" stroke="#d2dfdf" stroke-width="1">
    <rect x="32" y="149" width="218" height="125" rx="9"/>
    <rect x="276" y="149" width="174" height="125" rx="9"/>
    <rect x="474" y="149" width="180" height="125" rx="9"/>
    <rect x="678" y="149" width="166" height="125" rx="9"/>
    <rect x="868" y="149" width="220" height="125" rx="9"/>
  </g>
  <g fill="#167366"><rect x="32" y="149" width="4" height="125" rx="2"/><rect x="474" y="149" width="4" height="125" rx="2"/><rect x="868" y="149" width="4" height="125" rx="2"/></g>
  <text class="name" x="48" y="183">Survey</text>
  <text class="detail" x="48" y="207">Questions, content, logic</text>
  <text class="detail" x="48" y="227">and experimental tasks</text>
  <text class="fn" x="48" y="253">read_survey / read_qsf</text>
  <text class="name" x="292" y="183">RunConfig</text>
  <text class="detail" x="292" y="207">Checked settings</text>
  <text class="detail" x="292" y="227">for this simulation</text>
  <text class="fn" x="292" y="253">configure(...)</text>
  <text class="name" x="490" y="183">Plan</text>
  <text class="detail" x="490" y="207">Sample the twins</text>
  <text class="detail" x="490" y="227">Inspect exact prompts</text>
  <text class="fn" x="490" y="253">plan(survey, config)</text>
  <text class="name" x="694" y="183">Run</text>
  <text class="detail" x="694" y="207">Ask the model</text>
  <text class="detail" x="694" y="227">Resolve later stages</text>
  <text class="fn" x="694" y="253">run / arun</text>
  <text class="name" x="884" y="183">Results</text>
  <text class="detail" x="884" y="207">Answers, exposures, usage</text>
  <text class="detail" x="884" y="227">Checks, repairs and files</text>
  <text class="fn" x="884" y="253">results.save(...)</text>
  <path d="M141 274V294H564V278" fill="none" stroke="#95a9af" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M453 211H469" fill="none" stroke="#95a9af" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M657 211H673" fill="none" stroke="#95a9af" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M847 211H863" fill="none" stroke="#95a9af" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text class="detail" x="32" y="334">Read, configure, plan and preview without calling a model.</text>
  <text class="detail" x="678" y="334">Model calls begin when you run.</text>
</svg>
