name: Publish to PyPI

# Builds the package for a version tag and uploads it to PyPI. PyPI trusts this
# workflow (trusted publishing), so no password or token is stored anywhere.
# It runs when a GitHub release is published, or by hand for a tag:
#   gh workflow run publish.yml -f tag=v0.1.1

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to publish, such as v0.1.1"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/surveytwin/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and check the files
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check that the version matches the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -m pip install dist/*.whl
          version=$(python -c "import surveytwin; print(surveytwin.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "The package is version $version, but the tag is $TAG."
            exit 1
          fi
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
