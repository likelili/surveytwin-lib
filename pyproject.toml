[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surveytwin"
version = "0.1.1"
description = "Run surveys on simulated respondents (digital twins): a standard survey format, QSF import, and data in the layout of a Qualtrics export."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "pandas>=2.0", "pyarrow>=14"]

[project.scripts]
surveytwin = "surveytwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surveytwin = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
